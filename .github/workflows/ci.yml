name: CI

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (compilar y probar)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar, correr todas las pruebas y controlar la cobertura (JaCoCo)
        run: ./mvnw -B verify
      - name: Guardar los reportes de pruebas y de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-backend
          path: |
            app/target/surefire-reports
            app/target/site/jacoco
          if-no-files-found: ignore

  mutacion:
    name: Pruebas de mutación (PIT)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Mutar la capa de negocio (falla si el puntaje baja de 60%)
        run: ./mvnw -B test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Guardar el informe de mutación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-mutacion
          path: app/target/pit-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend (tipos, pruebas y build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/src/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/src/app/package-lock.json
      - run: npm ci
      - name: Revisar tipos
        run: npx tsc --noEmit
      - name: Pruebas
        run: npm test
      - name: Compilar
        run: npm run build

  secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # todo el historial, no solo el último commit
      - name: Buscar secretos en todo el historial
        run: |
          status=0
          # safe.directory: dentro del contenedor el repo pertenece a otro usuario y git se niega a leerlo
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --config /repo/.gitleaks.toml --redact \
            --report-format json --report-path /repo/gitleaks-report.json || status=$?
          # Cada hallazgo queda como anotación (regla, archivo y commit; nunca el valor del secreto)
          python3 - <<'PY'
          import json, os
          path = "gitleaks-report.json"
          for f in (json.load(open(path)) if os.path.exists(path) else []) or []:
              print(f"::error title=Secreto ({f['RuleID']})::{f['File']}:{f['StartLine']} en el commit {f['Commit'][:7]}")
          PY
          exit $status

  sistema-completo:
    name: Sistema completo (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Levantar MySQL, backend y frontend con un solo comando
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: La API responde y trae el catálogo
        run: |
          curl --fail --silent --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8080/api/products | head -c 300
      - name: La tienda se sirve y las rutas internas vuelven a index.html
        run: |
          curl --fail --silent http://localhost:5173/ | grep -q '<div id="root">'
          curl --fail --silent http://localhost:5173/productos/p1 | grep -q '<div id="root">'
      - name: Sonda de seguridad y resiliencia contra la API real (BOLA, BFLA, JWT, XXE, headers, ETag, DLQ...)
        run: python3 app/tests-api/sonda_seguridad.py sonda-resultado.json
      - name: Guardar el resultado de la sonda
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-sonda-seguridad
          path: sonda-resultado.json
          if-no-files-found: ignore
      - name: Mostrar los logs si algo falló
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Apagar
        if: always()
        run: docker compose down --volumes
