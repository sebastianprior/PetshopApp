# Análisis de SonarCloud (se ejecuta desde el CI, trabajo "backend" de .github/workflows/ci.yml).
sonar.organization=sebastianprior
sonar.projectKey=sebastianprior_PetshopApp
sonar.projectName=PetshopApp
sonar.sourceEncoding=UTF-8

# Código de producción: backend, tienda, scripts, workflows y Dockerfiles
sonar.sources=app/src/main,app/src/app,app/tests-api,.github,app/Dockerfile,docker-compose.yml
sonar.exclusions=**/node_modules/**,app/src/app/dist/**,app/src/app/public/**,app/src/app/test/**,app/src/app/e2e/**,**/*.svg,app/src/app/playwright-report/**

# Pruebas: backend (JUnit), tienda (Vitest) y punta a punta (Playwright)
sonar.tests=app/src/test/java,app/src/app/test,app/src/app/e2e

# Java: clases compiladas y cobertura de JaCoCo (./mvnw verify genera ambos)
sonar.java.binaries=app/target/classes
sonar.java.test.binaries=app/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=app/target/site/jacoco/jacoco.xml

# El CI espera el resultado del Quality Gate: si no pasa, el trabajo falla
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
