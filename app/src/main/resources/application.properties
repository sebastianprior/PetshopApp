spring.application.name=app

# MySQL database
spring.datasource.url=jdbc:mysql://localhost:3306/petshopdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=petshop
spring.datasource.password=petshop123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Petshop app properties
petshop.reset.cleaner.rate=300000
petshop.cors.allowed-origins=http://localhost:5173,http://localhost:4173

# Pasarela de pago simulada (API REST v1)
petshop.payments.timeout-ms=5000
petshop.payments.simulated-delay-ms=6000
petshop.payments.max-attempts=3
petshop.payments.worker-delay-ms=15000
petshop.payments.min-pending-age-ms=10000

# JWT
petshop.jwt.secret=${JWT_SECRET:change-this-secret-change-this-secret-change-this}
petshop.jwt.expiration-ms=86400000

# Uploads
petshop.uploads.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Pasarela SOAP: servidor en /ws; el checkout la consume por HTTP (por defecto, este mismo servidor)
# petshop.payments.soap-url=http://localhost:8080/ws
petshop.payments.soap-read-timeout-ms=30000

# Broker JMS embebido (Artemis): colas de eventos de ventas y de pagos fallidos
spring.artemis.mode=embedded
spring.artemis.embedded.persistent=false
spring.artemis.embedded.queues=ventas.confirmadas,ventas.canceladas,pagos.fallidos
