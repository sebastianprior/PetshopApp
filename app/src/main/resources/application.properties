spring.application.name=app

# Puerto: las plataformas de hosting lo definen con PORT
server.port=${PORT:8080}

# MySQL database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petshopdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:petshop}
spring.datasource.password=${DB_PASSWORD:petshop123}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Petshop app properties
petshop.reset.cleaner.rate=300000
petshop.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# Pasarela de pago simulada (API REST v1)
# MercadoPago (Checkout Pro). El Access Token es SECRETO: solo por variable de entorno, nunca en este archivo.
petshop.mercadopago.access-token=${MP_ACCESS_TOKEN:}
petshop.mercadopago.pending-expiry-minutes=${MP_PENDING_EXPIRY_MINUTES:30}
# A donde vuelve el cliente despues de pagar, y direccion publica del backend para que MercadoPago avise los pagos (webhook)
petshop.frontend-url=${FRONTEND_URL:http://localhost:5173}
petshop.public-api-url=${PUBLIC_API_URL:}
# Medios de pago de prueba (tok_aprobado, etc.): apagarlos en produccion con SIMULATED_PAYMENTS=false
petshop.payments.simulated-enabled=${SIMULATED_PAYMENTS:true}
petshop.payments.timeout-ms=5000
petshop.payments.simulated-delay-ms=6000
petshop.payments.max-attempts=3
petshop.payments.worker-delay-ms=15000
petshop.payments.min-pending-age-ms=10000

# JWT
# Sin JWT_SECRET se genera un secreto aleatorio por ejecucion (no hay valor por defecto)
petshop.jwt.secret=${JWT_SECRET:}

# Ingreso con Google: Client ID de la aplicacion web (es publico; el origen autorizado se define en Google Cloud Console)
petshop.google.client-id=${GOOGLE_CLIENT_ID:474429758044-hjrc4gsmrn3e7jstl3hd26a5ojc8kmam.apps.googleusercontent.com}
# Access token: maximo 15 minutos (JwtUtil rechaza valores mayores); la sesion se renueva con el refresh token
petshop.jwt.expiration-ms=900000
petshop.jwt.refresh-expiration-ms=604800000

# Uploads
petshop.uploads.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Pasarela SOAP: servidor en /ws; el checkout la consume por HTTP (por defecto, este mismo servidor)
# petshop.payments.soap-url=http://localhost:8080/ws
# Igual al timeout del checkout (petshop.payments.timeout-ms, 5 s): una llamada que ya venció no queda colgada en la red
petshop.payments.soap-read-timeout-ms=5000
# Llamadas simultáneas a la pasarela (si se llena, la venta queda pendiente y se reintenta)
petshop.payments.max-concurrent-calls=32

# Broker JMS embebido (Artemis): colas de eventos de ventas y de pagos fallidos
spring.artemis.mode=embedded
# Persistente (ARTEMIS_PERSISTENT=true, como en el docker-compose y el Dockerfile): los mensajes en cola sobreviven a un
# reinicio y el journal queda en esta carpeta. Apagado por defecto porque con Java 25 o más Netty no puede releer el journal
# (el sistema corre en Java 21). Aun así no se pierden eventos: esperan en la tabla outbox hasta llegar al broker.
spring.artemis.embedded.persistent=${ARTEMIS_PERSISTENT:false}
spring.artemis.embedded.data-directory=${ARTEMIS_DATA_DIR:artemis-data}
spring.artemis.embedded.queues=ventas.confirmadas,ventas.canceladas,pagos.fallidos,DLQ

# Jakarta REST (Jersey) publicado en /jakarta/*
spring.jersey.application-path=/jakarta

# Errores: nunca exponer stacktraces ni mensajes internos al cliente
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never

# Casilla simulada de emails (en produccion: SMTP)
petshop.mail.outbox-dir=outbox
